# Generate Decode.xcodeproj with XcodeGen:
#   brew install xcodegen
#   cd ios && xcodegen
name: Decode
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Decode:
    type: application
    platform: iOS
    sources:
      - path: Decode
    settings:
      base:
        # Change this to your own reverse-domain ID before shipping.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.decode
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Decode
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Decode saves your result cards to your photo library.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  Decode:
    build:
      targets:
        Decode: all
    run:
      config: Debug
      # Lets you test subscriptions in the simulator without App Store Connect.
      storeKitConfiguration: Decode.storekit
    archive:
      config: Release
